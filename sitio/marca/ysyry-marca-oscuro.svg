  <path d="M6 33 L23 23" fill="none" stroke="#8A94A0" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M23 23 C31 27, 34 33, 43 38" fill="none" stroke="#518FB8" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="23" cy="23" r="4.6" fill="#518FB8"/>
  <circle cx="23" cy="23" r="8.2" fill="none" stroke="#518FB8" stroke-width="1.3" opacity=".55"/>
