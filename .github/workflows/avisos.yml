name: Avisos oficiales (meteorología y desastres)

# Cada 3 horas, público. INMET (Brasil), Meteorología de Paraguay y GDACS (ONU y Comisión Europea): avisos vigentes que tocan el corredor.
# No consume tokens de Claude. No consulta (y lo declara) el SMN de Argentina, que exige una clave, ni el INUMET de Uruguay.
on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Leer avisos
        env:
          DATOS_DIR: datos/publico
        run: python3 -u colectores/avisos_oficiales.py
      - name: Guardar
        run: |
          git config user.name "ysyry-robot"
          git config user.email "ysyry-robot@users.noreply.github.com"
          git add datos/publico/avisos_oficiales.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Avisos oficiales (corrida automática)"
            git pull --rebase --quiet
            git push
          fi
