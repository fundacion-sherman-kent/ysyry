name: Alertas de la UE sobre alimentos del corredor (RASFF)

# Diario, público. Baja de RASFF Window (Comisión Europea) las notificaciones de alimentos y piensos con origen en Argentina, Brasil, Paraguay, Bolivia y Uruguay,
# de los últimos 12 meses, para el indicador de adulteración y contaminación. No consume tokens de Claude.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leer RASFF
        env:
          DATOS_DIR: datos/publico
        run: python3 -u colectores/rasff.py
      - name: Guardar
        run: |
          git config user.name "ysyry-robot"
          git config user.email "ysyry-robot@users.noreply.github.com"
          git add datos/publico/rasff-corredor.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "RASFF: alertas de alimentos del corredor (corrida automática)"
            git pull --rebase --quiet
            git push
          fi
