name: Viento en el Plata (SMN)

# Cada 3 horas, público. Estado del tiempo presente del Servicio Meteorológico Nacional (dato abierto, CC BY 4.0): viento en la ribera del Plata.
# Es contexto del nivel del río. No consume tokens de Claude.
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Leer viento
        env:
          DATOS_DIR: datos/publico
        run: python3 -u colectores/viento_smn.py
      - name: Guardar
        run: |
          git config user.name "ysyry-robot"
          git config user.email "ysyry-robot@users.noreply.github.com"
          git add datos/publico/viento-smn.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Viento en el Plata: SMN (corrida automática)"
            git pull --rebase --quiet
            git push
          fi
