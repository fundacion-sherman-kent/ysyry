name: Escáner propio (hechos del corredor)

# Cada 3 horas, público. Baja canales RSS/Atom públicos de medios regionales y de organismos, y detecta con reglas (palabras clave,
# lugares y cantidades) hechos sobre el corredor. NO usa ningún modelo: cero tokens. Lo que sale son candidatos, no hechos verificados.
on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Escanear
        env:
          DATOS_DIR: datos/publico
        run: python3 -u colectores/escaner.py
      - name: Guardar
        run: |
          git config user.name "ysyry-robot"
          git config user.email "ysyry-robot@users.noreply.github.com"
          git add datos/publico/escaner.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Escáner: candidatos de hechos del corredor (corrida automática)"
            git pull --rebase --quiet
            git push
          fi
