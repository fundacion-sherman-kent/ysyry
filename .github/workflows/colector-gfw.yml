name: Colector Global Fishing Watch (conteos)

# Manual. Cuenta eventos por tramo del corredor y los imprime en el registro.
# No guarda datos crudos ni escribe nada en el repositorio.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "1 = una sola consulta, para medir tiempo y respuesta"
        default: "1"
      dias:
        description: "Días hacia atrás"
        default: "90"
      diagnostico:
        description: "1 = probar variantes de la consulta y mostrar sólo los códigos"
        default: "0"

permissions:
  contents: read

jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Contar eventos por tramo
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          PRUEBA: ${{ inputs.prueba }}
          DIAS: ${{ inputs.dias }}
          DIAGNOSTICO: ${{ inputs.diagnostico }}
        run: python3 -u colectores/gfw_resumen.py
