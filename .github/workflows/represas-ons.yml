name: Represas del Paraná (ONS)

# Cada 3 horas, público. Nivel y caudales de Itaipú, Jupiá y Porto Primavera, de los datos abiertos del ONS (Brasil, CC BY 4.0). No consume tokens de Claude.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Leer las represas
        env:
          DATOS_DIR: datos/publico
        run: python3 -u colectores/represas_ons.py
      - name: Guardar
        run: |
          git config user.name "ysyry-robot"
          git config user.email "ysyry-robot@users.noreply.github.com"
          git add datos/publico/represas-ons.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Represas del Paraná: ONS (corrida automática)"
            git pull --rebase --quiet
            git push
          fi
