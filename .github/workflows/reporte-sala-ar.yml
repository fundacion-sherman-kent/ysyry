name: Reporte diario de la Cuenca del Plata (Argentina)

# Dos veces por día, público. Lee el PDF del Reporte hidrometeorológico diario de la Subsecretaría de Recursos Hídricos de Argentina: caudales de Itaipú y de
# Yacyretá, con tendencia, alertas y pronóstico. Sale los días hábiles. Si el PDF cambia de formato, no se escribe nada y el robot de salud lo avisa.
# No consume tokens de Claude.
on:
  schedule:
    - cron: "15 13,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar el lector de PDF
        run: pip install --quiet pypdf
      - name: Leer el reporte
        env:
          DATOS_DIR: datos/publico
        run: python3 -u colectores/reporte_sala_ar.py
      - name: Guardar
        run: |
          git config user.name "ysyry-robot"
          git config user.email "ysyry-robot@users.noreply.github.com"
          git add datos/publico/reporte-sala-ar.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Reporte diario de la Cuenca del Plata: Argentina (corrida automática)"
            git pull --rebase --quiet
            git push
          fi
